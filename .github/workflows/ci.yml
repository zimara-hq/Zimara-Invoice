name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zimara
          POSTGRES_PASSWORD: zimara
          POSTGRES_DB: zimara_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zimara" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://zimara:zimara@localhost:5432/zimara_test
      TEST_DATABASE_URL: postgresql://zimara:zimara@localhost:5432/zimara_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test
      - run: npx next build
      - run: npm audit --omit=dev
