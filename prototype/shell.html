<style>
/* Zimara palette: Indigo #23003F, Violet #8447F2, Lavender #BCACCE, Ember #F94500, Solar Mist #FFFDB4. Layout: an accounting workspace — fixed navigation rail on the right (RTL), working sheet on the left; on phones the rail becomes a scrollable strip */
:root{
  --bg:#f7f5fb; --surface:#ffffff; --sunk:#efebf6; --fg:#1b0930; --muted:#675a7a; --line:#e3dcee;
  --accent:#7a3cf0; --accent-fg:#ffffff; --accent-soft:#efe7fe;
  --gold:#9a5b00; --gold-soft:#fdf1dc; --bad:#b3261e; --bad-soft:#fbe6e4; --ok:#1f7a44; --ok-soft:#e3f4ea; --info:#3d4fb8; --info-soft:#e8ebfa;
  --indigo:#23003f; --ember:#f94500; --mist:#fffdb4;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11001e; --surface:#1b0a2d; --sunk:#241338; --fg:#f1ecf8; --muted:#ab9fc0; --line:#352349;
  --accent:#9d6bff; --accent-fg:#12001f; --accent-soft:#2b1748;
  --gold:#f0be6a; --gold-soft:#33260f; --bad:#f19a92; --bad-soft:#3a1717; --ok:#7fd49c; --ok-soft:#15301f; --info:#a9b6ff; --info-soft:#1d2142; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11001e; --surface:#1b0a2d; --sunk:#241338; --fg:#f1ecf8; --muted:#ab9fc0; --line:#352349;
  --accent:#9d6bff; --accent-fg:#12001f; --accent-soft:#2b1748;
  --gold:#f0be6a; --gold-soft:#33260f; --bad:#f19a92; --bad-soft:#3a1717; --ok:#7fd49c; --ok-soft:#15301f; --info:#a9b6ff; --info-soft:#1d2142; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
#app{direction:rtl;display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.nav{background:var(--indigo);color:#efe8fb;border-inline-end:0;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand img{height:32px;width:auto;display:block}
.brand b{font-family:var(--display);font-size:1.15rem;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:.75rem}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:#d9ceec;text-decoration:none;font-size:.95rem;white-space:nowrap}
.nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a[aria-current="page"]{background:rgba(132,71,242,.38);color:#fff;font-weight:600}
.nav .sep{height:1px;background:rgba(255,255,255,.12);margin:10px 6px}
.nav .foot{margin-top:auto;padding:12px 8px 0;font-size:.8rem;color:#b6a8cf}
.nav .foot b{color:#fff}
.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 60px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:18px 14px;border-bottom:1px solid var(--line);margin-bottom:20px}
.top h1{font-family:var(--display);font-size:1.4rem;margin:0;font-weight:600;text-wrap:balance}
.top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap;font-weight:500}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--gold-soft);color:var(--gold)}.pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.pill.plain::before{display:none}
.wrap{max-width:1180px}
h2{font-family:var(--display);font-size:1.12rem;margin:0 0 12px;font-weight:600}
h3{font-family:var(--display);font-size:1rem;margin:0 0 8px;font-weight:600}
p{margin:6px 0}
.muted{color:var(--muted)}.small{font-size:.85rem}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.homegrid{grid-template-columns:minmax(0,1.75fr) minmax(280px,1fr);align-items:start}
@media (max-width:1100px){.homegrid{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kpi .label{color:var(--muted);font-size:.85rem}
.kpi .value{font-family:var(--mono);font-size:1.55rem;font-variant-numeric:tabular-nums;direction:ltr;text-align:right;margin-top:2px}
.kpi .hint{font-size:.8rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:500;font-size:.92rem;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
label.f span.req::after{content:" *";color:var(--bad)}
input.in,select.in,textarea.in{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 10px;color:var(--fg);width:100%;min-width:0;font-size:.95rem}
textarea.in{resize:vertical;min-height:70px}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:start;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:.8rem;background:var(--sunk)}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sunk)}
td.wrap-cell{white-space:normal;min-width:160px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty h3{color:var(--fg)}
.notice{border-radius:var(--radius);padding:12px 16px;border:1px solid var(--line);background:var(--surface);font-size:.92rem}
.notice.warn{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 30%,transparent)}
.notice.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.notice.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.notice.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.checks li{display:flex;gap:8px;align-items:flex-start}
.checks .ic{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;margin-top:2px}
.ic.e{background:var(--bad-soft);color:var(--bad)}.ic.w{background:var(--gold-soft);color:var(--gold)}.ic.o{background:var(--ok-soft);color:var(--ok)}.ic.p{background:var(--sunk);color:var(--muted)}
.code{font-family:var(--mono);font-size:.74rem;color:var(--muted);direction:ltr;unicode-bidi:isolate}
pre.xml{direction:ltr;text-align:left;font-family:var(--mono);font-size:.74rem;background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:12px;max-height:380px;overflow:auto;white-space:pre;margin:0}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:.88rem}
.bar .track{grid-column:1/-1;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:99px}
.lines{display:flex;flex-direction:column;gap:10px}
.line{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,.8fr) minmax(0,1.3fr) auto;gap:8px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.line .reason,.line .name{grid-column:1/-1}
.line .lt{grid-column:1/-1;display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
@media (max-width:760px){.line{grid-template-columns:1fr 1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:3px;background:var(--sunk);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:.92rem}
.sum .t{font-weight:600;font-size:1.05rem;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.ai{background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft));border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);border-radius:var(--radius);padding:14px 16px}
.ai h3{display:flex;align-items:center;gap:8px;color:var(--accent)}
.ai h3 svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
/* modal */
[hidden]{display:none!important}
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,20,18,.45);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--bg);border-radius:12px;width:100%;max-width:1060px;direction:rtl;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sheet-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);border-radius:12px 12px 0 0;z-index:2}
.sheet-body{padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
@media (max-width:900px){.sheet-body{grid-template-columns:minmax(0,1fr)}}
/* invoice paper */
.paper{background:#fff;color:#16201f;border-radius:6px;border:1px solid #d9dfdc;padding:26px;font-size:.88rem;min-width:0}
.paper .ph{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid #0c5a53;padding-bottom:14px}
.paper h2{color:#0c5a53;font-size:1.25rem;margin:0}
.paper .en{direction:ltr;color:#5d6b69;font-size:.8rem}
.paper .parties{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:16px 0}
.paper .pbox{background:#f3f6f5;border-radius:6px;padding:10px 12px}
.paper .pbox b{display:block;color:#0c5a53;font-size:.8rem;margin-bottom:4px}
.paper table th{background:#eef3f1;color:#4b5957}
.paper table td,.paper table th{border-bottom:1px solid #e3e8e6}
.paper .totals{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:14px;align-items:flex-end}
.paper .qr{background:#fff;padding:4px;border:1px solid #e3e8e6;border-radius:6px;width:150px;height:150px}
.paper .qr svg{width:100%;height:100%;display:block}
.paper .sum{min-width:250px;color:#16201f}
.paper .sum .t{border-color:#d9dfdc}
.paper .stamp{font-size:.72rem;color:#5d6b69;margin-top:14px;border-top:1px dashed #d9dfdc;padding-top:10px;direction:ltr;text-align:left;word-break:break-all;font-family:var(--mono)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:.84rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-all}
/* chat */
.chat{display:flex;flex-direction:column;gap:12px;min-height:300px}
.msg{max-width:min(720px,92%);padding:10px 14px;border-radius:12px;white-space:pre-wrap;line-height:1.75}
.msg.u{align-self:flex-start;background:var(--accent);color:var(--accent-fg);border-end-start-radius:4px}
.msg.a{align-self:flex-end;background:var(--surface);border:1px solid var(--line);border-end-end-radius:4px}
.msg.tool{align-self:flex-end;font-size:.8rem;color:var(--muted);background:transparent;padding:0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:.85rem;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
/* plans */
.plan{display:flex;flex-direction:column;gap:8px}
.plan.hot{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.plan .price{font-family:var(--mono);font-size:1.8rem;direction:ltr;text-align:right}
.plan ul{margin:0;padding-inline-start:18px;font-size:.88rem}
.plan li{margin:3px 0}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:60;direction:rtl;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,520px)}
.toast{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:.92rem;box-shadow:0 8px 24px rgba(0,0,0,.2)}
